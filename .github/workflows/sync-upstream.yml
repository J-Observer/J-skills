name: Daily upstream sync
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'J-Observer/J-skills'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - name: Merge and validate upstream
        run: python scripts/maintenance/sync_upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
